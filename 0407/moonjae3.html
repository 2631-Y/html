<div class="container">
  
<div class="dog-wrapper">
    <div class="card">
        <h3>강아지 집</h3>
        <p>강아지가 편히 쉴 수 있는 포근한 집이 필요합니다. 세탁이 간편한 제품인지 확인하세요.</p>
    </div>

    <div class="card">
        <h3>강아지 먹이</h3>
        <p>강아지의 먹이는 꼭 어린 강아지용 사료를 선택하세요. 성장에 맞춰 급여해야 합니다.</p>
    </div>

    <div class="card">
        <h3>밥그릇, 물병</h3>
        <p>밥그릇은 쉽게 넘어지지 않도록 바닥이 넓은 것이 좋습니다. 물병은 대용량이 편합니다.</p>
    </div>

    <div class="card">
        <h3>이름표, 목줄</h3>
        <p>강아지를 잃어버릴 염려가 있으니 산책할 무렵이 되면 이름표를 꼭 목에 걸어주세요.</p>
    </div>
