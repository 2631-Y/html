<!DOCTYPE html>
<html lang="kr">
<head>
    <meta charset="UTF-8">
    <title>MY</title>
  <style>
		
        #round {border-top-right-radius: 55%;}         #round{border-top-left-radius: 55%;}


          
                .box1 {
                width: 400px;
                height: 100px;
                border: 2px solid black; 
                }

                .box2 {
                width: 50%;
                height: 100px;
                border: 2px dashed red; 
                }

  
  

        
        .box-container1{
        width : 1200px;
        height : 100px;
        margin : 0;
        color : black;
        border: 2px dashed red; 
        }
        
        
        .box-container2{
        width : 1200px;
        height : 100px;
        margin : 50px;
        color : black;
        border: 2px dashed red; 
        }
        
        /* 가운데 정렬 (자주 씀!) */
        .box-container3{
        width : 1200px;
        height : 100px;
        margin : 0 auto;  /* 상하 0, 좌우 auto → 가로 가운데 정렬 */
                                            /* 단, width가 지정되어 있어야 작동 */
        color : black;
        border: 2px dashed red; 
        }







  </style>
  
  

</head>
<body>
<div class = "box1"> 1</div>
<div class = "box2"> 2</div>
<div class = "box-container1"> 1</div>
<div class = "box-container2"> 2</div>
<div class = "box-container2"> 3</div>
<img src="다운로드.jpg">
<img id="round" src="다운로드.jpg">
</body>
</html>
